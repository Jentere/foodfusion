<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unregister Service Worker - FoodFusion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 1rem;
        }
        .status {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            font-weight: 600;
        }
        .success {
            background: #c6f6d5;
            color: #22543d;
        }
        .info {
            background: #bee3f8;
            color: #2c5282;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        #log {
            margin-top: 1rem;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 8px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Service Worker Cleanup</h1>
        <p>This page will unregister all service workers and clear the cache.</p>
        
        <div id="status" class="status info">
            Checking for service workers...
        </div>
        
        <div id="log"></div>
        
        <a href="index.php" class="btn">← Back to Homepage</a>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        
        function log(message) {
            console.log(message);
            logDiv.innerHTML += message + '<br>';
        }
        
        async function unregisterServiceWorkers() {
            if ('serviceWorker' in navigator) {
                try {
                    log('Checking for service workers...');
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    
                    if (registrations.length === 0) {
                        log('No service workers found.');
                        statusDiv.className = 'status success';
                        statusDiv.textContent = '✓ No service workers to unregister';
                        return;
                    }
                    
                    log(`Found ${registrations.length} service worker(s)`);
                    
                    for (let registration of registrations) {
                        log(`Unregistering: ${registration.scope}`);
                        await registration.unregister();
                        log('✓ Unregistered successfully');
                    }
                    
                    // Clear all caches
                    log('Clearing caches...');
                    const cacheNames = await caches.keys();
                    log(`Found ${cacheNames.length} cache(s)`);
                    
                    for (let cacheName of cacheNames) {
                        log(`Deleting cache: ${cacheName}`);
                        await caches.delete(cacheName);
                        log('✓ Cache deleted');
                    }
                    
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✓ All service workers unregistered and caches cleared!';
                    log('✓ Cleanup complete!');
                    log('Please refresh the page or clear your browser cache.');
                    
                } catch (error) {
                    log('Error: ' + error.message);
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '✗ Error during cleanup: ' + error.message;
                }
            } else {
                log('Service workers not supported in this browser');
                statusDiv.className = 'status info';
                statusDiv.textContent = 'Service workers not supported';
            }
        }
        
        // Run on page load
        unregisterServiceWorkers();
    </script>
</body>
</html>
